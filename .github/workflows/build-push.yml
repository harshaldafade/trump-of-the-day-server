name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # Only rebuild when something that actually ends up in the image changes
    # (see Dockerfile's COPY lines) -- doc/workflow/server/db-only pushes skip this.
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'insert_news.py'
      - 'news_scraper.py'
      - 'lib/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/daily-news-job:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/daily-news-job:latest
