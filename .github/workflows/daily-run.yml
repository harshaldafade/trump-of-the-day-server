# Pulls the image built by build-push.yml and runs the daily scrape.
#
# NOTE: GitHub auto-disables `schedule` triggers after ~60 days with no
# repository activity, and re-enabling requires a manual click in the
# Actions tab (a new push does NOT re-enable it automatically). If this
# job silently stops running, check
# https://github.com/harshaldafade/trump-of-the-day-server/actions/workflows/daily-run.yml
# for a "this scheduled workflow is disabled" banner.
name: Run Docker image for Daily News Job

on:
  schedule:
    - cron: '0 14 * * *'  # Runs every day at 14:00 UTC
  workflow_dispatch:

jobs:
  run-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker pull ghcr.io/${{ github.repository }}/daily-news-job:latest

      # The enrichment keys are optional: if a secret isn't set, that step is
      # skipped and the raw feed is still inserted.
      #   OPENROUTER_API_KEY  daily digest via OpenRouter's free router (preferred when set)
      #   ANTHROPIC_API_KEY   daily digest with Claude (DIGEST_PROVIDER=anthropic)
      #   VOYAGE_API_KEY      embeddings for search / related coverage
      #   UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN
      #                       tell the API (Cloud Run) a day changed: clears its
      #                       cached copy and pushes a live update to browsers
      # OPENROUTER_MODELS / DIGEST_PROVIDER / ANTHROPIC_MODEL are optional
      # repository variables (Settings > Variables) to override the defaults.
      - name: Run Docker container
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: >-
          docker run --rm
          -e DATABASE_URL -e OPENROUTER_API_KEY -e ANTHROPIC_API_KEY -e VOYAGE_API_KEY
          -e UPSTASH_REDIS_REST_URL -e UPSTASH_REDIS_REST_TOKEN
          -e OPENROUTER_MODELS -e DIGEST_PROVIDER -e ANTHROPIC_MODEL
          "ghcr.io/${{ github.repository }}/daily-news-job:latest"
