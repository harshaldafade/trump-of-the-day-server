# Pulls the image built by build-push.yml and runs the daily scrape.
#
# NOTE: GitHub auto-disables `schedule` triggers after ~60 days with no
# repository activity, and re-enabling requires a manual click in the
# Actions tab (a new push does NOT re-enable it automatically). If this
# job silently stops running, check
# https://github.com/harshaldafade/trump-of-the-day-server/actions/workflows/daily-run.yml
# for a "this scheduled workflow is disabled" banner.
name: Run Docker image for Daily News Job

on:
  schedule:
    - cron: '0 14 * * *'  # Runs every day at 14:00 UTC
  workflow_dispatch:

jobs:
  run-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker pull ghcr.io/${{ github.repository }}/daily-news-job:latest

      - name: Run Docker container
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            ghcr.io/${{ github.repository }}/daily-news-job:latest
